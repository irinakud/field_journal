name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          include-prerelease: true

      - name: Restore backend dependencies
        run: dotnet restore ${{ github.workspace }}/backend/FieldJournal.slnx

      - name: Run backend tests
        run: dotnet test ${{ github.workspace }}/backend/FieldJournal.slnx --no-restore --verbosity minimal

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ github.workspace }}/frontend/field-journal

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ github.workspace }}/frontend/field-journal/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build
